<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="Arial, sans-serif" font-size="12">
  <rect width="760" height="480" fill="#f8faf9"/>
  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold">Diagrama de Classes</text>
  <g transform="translate(20,40)">
    <rect width="140" height="70" fill="#fff" stroke="#333"/>
    <text x="70" y="22" text-anchor="middle" font-weight="bold">Course</text>
    <text x="70" y="42" text-anchor="middle">+ name</text>
  </g>
  <g transform="translate(200,40)">
    <rect width="150" height="90" fill="#fff" stroke="#333"/>
    <text x="75" y="22" text-anchor="middle" font-weight="bold">Professor</text>
    <text x="75" y="42" text-anchor="middle">+ name, siape</text>
    <text x="75" y="58" text-anchor="middle">+ user: User</text>
  </g>
  <g transform="translate(390,40)">
    <rect width="150" height="90" fill="#fff" stroke="#333"/>
    <text x="75" y="22" text-anchor="middle" font-weight="bold">Student</text>
    <text x="75" y="42" text-anchor="middle">+ name, ra, phone</text>
    <text x="75" y="58" text-anchor="middle">+ user: User</text>
  </g>
  <g transform="translate(580,40)">
    <rect width="150" height="70" fill="#fff" stroke="#333"/>
    <text x="75" y="22" text-anchor="middle" font-weight="bold">User (Django)</text>
    <text x="75" y="42" text-anchor="middle">+ username, email</text>
  </g>
  <g transform="translate(40,180)">
    <rect width="170" height="100" fill="#fff" stroke="#333"/>
    <text x="85" y="22" text-anchor="middle" font-weight="bold">Material</text>
    <text x="85" y="42" text-anchor="middle">+ title, text_content</text>
    <text x="85" y="58" text-anchor="middle">+ file, public</text>
    <text x="85" y="74" text-anchor="middle">+ owner: Professor</text>
  </g>
  <g transform="translate(260,180)">
    <rect width="170" height="90" fill="#fff" stroke="#333"/>
    <text x="85" y="22" text-anchor="middle" font-weight="bold">ChatBot</text>
    <text x="85" y="42" text-anchor="middle">+ prompt</text>
    <text x="85" y="58" text-anchor="middle">+ owner: Professor</text>
  </g>
  <g transform="translate(480,180)">
    <rect width="170" height="80" fill="#fff" stroke="#333"/>
    <text x="85" y="22" text-anchor="middle" font-weight="bold">Conversation</text>
    <text x="85" y="42" text-anchor="middle">+ title, timestamps</text>
  </g>
  <g transform="translate(480,300)">
    <rect width="170" height="90" fill="#fff" stroke="#333"/>
    <text x="85" y="22" text-anchor="middle" font-weight="bold">Message</text>
    <text x="85" y="42" text-anchor="middle">+ role, content</text>
    <text x="85" y="58" text-anchor="middle">+ sources (JSON)</text>
  </g>
  <line x1="160" y1="75" x2="200" y2="75" stroke="#666"/>
  <line x1="350" y1="75" x2="390" y2="75" stroke="#666"/>
  <line x1="275" y1="130" x2="125" y2="180" stroke="#666"/>
  <line x1="345" y1="130" x2="345" y2="180" stroke="#666"/>
  <line x1="125" y1="230" x2="260" y2="230" stroke="#666"/>
  <line x1="430" y1="230" x2="480" y2="220" stroke="#666"/>
  <line x1="565" y1="260" x2="565" y2="300" stroke="#666"/>
  <text x="90" y="170" fill="#666">N:N</text>
  <text x="300" y="170" fill="#666">1:N</text>
  <text x="200" y="225" fill="#666">N:N</text>
  <text x="450" y="215" fill="#666">N:1</text>
  <text x="575" y="285" fill="#666">1:N</text>
</svg>
