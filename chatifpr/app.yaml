runtime: python312

entrypoint: gunicorn -b :$PORT --workers 1 --threads 8 --timeout 120 chatifpr.wsgi:application

instance_class: F2

handlers:
- url: /static
  static_dir: static_gcloud

- url: /.*
  script: auto

automatic_scaling:
  min_instances: 0
  max_instances: 1
  max_concurrent_requests: 8

env_variables:
  DEBUG: "False"
  ALLOWED_HOSTS: ".appspot.com"
  CSRF_TRUSTED_ORIGINS: "https://*.appspot.com"
