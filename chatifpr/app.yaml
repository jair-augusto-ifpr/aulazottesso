runtime: python312 

entrypoint: gunicorn -b :$PORT --workers 1 --threads 30 --timeout 0 chatifpr.wsgi
instance_class: F4_1G


handlers:

- url: /static

  static_dir: static_gcloud/

- url: /.*

  script: auto


automatic_scaling:

  min_instances: 1

  max_instances: 3

  max_concurrent_requests: 30